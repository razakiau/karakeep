name: Build Fork Image

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from"
        required: true
        default: "feat/content-source-tracking-v3"
      tag:
        description: "Image tag (default: latest)"
        required: false
        default: "latest"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: aio
          platforms: linux/amd64
          push: true
          # Derived from the repo rather than hardcoded: this fork moved from
          # zackautocracy to razakiau, and the old hardcoded org silently broke
          # the push. ${{ github.repository }} follows a rename automatically.
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.event.inputs.tag }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          # Without these the image inherits upstream's source label and has no
          # revision at all, so identifying the deployed code took four separate
          # probes. Now `docker image inspect` answers it.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.event.inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
